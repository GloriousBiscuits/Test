<style>

<script>
(function () {
  const DS_ID = "81c5ef6c-ab99-4db6-a754-2558512184a2";
  const COMPANIES = ["WSH", "Bacari", "Live.Eat.Surf", "TRIS", "Cajun Steamer", "Crooked Hammock", "Stacked", "Trudy's", "Big Table Restaurants", "Marugame Udon", "Original ChopShop", "Cherry Bounce", "HH - Internal", "HH - External"];
  const PRIORITIES = ["1 - High", "2 - Mid High", "3 - Medium", "4 - Mid Low", "5 - Low"];
  const REVIEW = ["pending", "adding", "approved", "check"];
  const CONNECTOR_CODES = ["approval_required", "needs_reauth", "server_not_connected", "selection_required", "not_in_manifest", "blocked_by_policy", "not_granted", "capability_disabled", "capability_removed", "server_not_found", "consent_required"];

  const S = { tasks: new Map(), tstate: "idle", tcode: null, tat: null, snap: null, open: null, day: null, moves: new Map(), saving: null, tmsg: null, flash: null, items: [], meta: null, tab: "today", selected: new Set(), edits: new Map(), busy: false, loaded: false, dbError: null, slow: false, banner: null };
  let db = null, mcp = null;

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function safeUrl(u) { try { const x = new URL(u); return x.protocol === "https:" ? x.href : null; } catch (e) { return null; } }
  function nowIso() { return new Date().toISOString(); }
  function str(v) { return typeof v === "string" ? v : ""; }
  function parseDay(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(str(s))) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function today() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function fmtDay(s) { const d = parseDay(s); return d ? d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : ""; }
  function fmtStamp(s) { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  // NYSE holidays; dates you pick never land on these.
  const HOLIDAYS = new Set(["2026-11-26", "2026-12-25", "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31", "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24"]);
  function isOff(x) { const w = x.getDay(); return w === 0 || w === 6 || HOLIDAYS.has(iso(x)); }
  function businessDaysUntil(s) {
    const d = parseDay(s); if (!d) return null;
    const t = today(); const sign = d >= t ? 1 : -1; let n = 0; const cur = new Date(t);
    while ((sign > 0 && cur < d) || (sign < 0 && cur > d)) { cur.setDate(cur.getDate() + sign); if (!isOff(cur)) n += sign; }
    return n;
  }
  function dueBadge(s) {
    const n = businessDaysUntil(s); if (n == null) return null;
    let label, cls = "due";
    if (n < 0) { label = (-n) + (n === -1 ? " day late" : " days late"); cls += " late"; }
    else if (n === 0) { label = "due today"; cls += " soon"; }
    else if (n === 1) { label = "due next business day"; cls += " soon"; }
    else { label = "in " + n + " business days"; if (n <= 3) cls += " soon"; }
    return h("span", { class: cls, text: label });
  }
  function urgencyFor(due) { const n = businessDaysUntil(due); return n == null ? null : (n <= 2 ? "Urgent" : "Not Urgent"); }
  function eff(item) { return Object.assign({}, item, S.edits.get(item.id) || {}); }
  function byId(id) { return S.items.find(i => i.id === id); }
  function isUpdate(i) { return i.type === "update"; }
  function sortKey(i) { return isUpdate(i) ? str(i.current_due) : str(eff(i).due); }
  function reviewItems() {
    return S.items.filter(i => REVIEW.includes(i.status) && !isUpdate(i)).sort((a, b) => {
      const da = sortKey(a) || "9999", dbb = sortKey(b) || "9999";
      return da < dbb ? -1 : da > dbb ? 1 : str(a.proposed_at) < str(b.proposed_at) ? -1 : 1;
    });
  }
  function dateItems() {
    const rank = { done: 0, moved: 1, active: 2, quiet: 3 };
    return S.items.filter(i => REVIEW.includes(i.status) && isUpdate(i)).sort((a, b) => {
      const ra = rank[str(a.signal)] ?? 4, rb = rank[str(b.signal)] ?? 4;
      if (ra !== rb) return ra - rb;
      const da = sortKey(a) || "9999", dbb = sortKey(b) || "9999";
      return da < dbb ? -1 : da > dbb ? 1 : 0;
    });
  }
  function tabItems() { return S.tab === "dates" ? dateItems() : S.tab === "review" ? reviewItems() : []; }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function weekday(d) { const x = new Date(d); while (isOff(x)) x.setDate(x.getDate() + 1); return x; }
  function addBiz(n) { const x = today(); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); if (!isOff(x)) k++; } return x; }
  function nextDow(dow) { const x = today(); do { x.setDate(x.getDate() + 1); } while (x.getDay() !== dow); return weekday(x); }

  function quickDates() {
    return [["In 2 days", iso(addBiz(2))], ["Friday", iso(nextDow(5))], ["Next Mon", iso(nextDow(1))], ["+1 week", iso(plusDays(7))], ["+2 weeks", iso(plusDays(14))], ["Month end", iso(monthEnd())]];
  }
  const ACTIONS = [["move", "Move date"], ["done", "Mark done"], ["archive", "Archive"]];
  function addedItems() { return S.items.filter(i => i.status === "added").sort((a, b) => str(b.added_at) < str(a.added_at) ? -1 : 1); }
  function dismissedItems() { return S.items.filter(i => i.status === "dismissed" || i.status === "expired").sort((a, b) => str(b.decided_at) < str(a.decided_at) ? -1 : 1); }

  // ---------- render ----------
  function render() {
    renderSub(); renderBanner(); renderTabs(); renderList(); renderRail(); renderBar();
  }
  function renderSub() {
    const sub = document.getElementById("sub");
    if (!S.loaded) { sub.textContent = S.slow ? "Still connecting. The queue can't be reached yet." : "Connecting…"; return; }

    const last = S.meta && S.meta.last_run ? "Last scan " + fmtStamp(S.meta.last_run) : "No scan yet";
    sub.textContent = last + " · " + n + (n === 1 ? " new item" : " new items") + " · " + nd + (nd === 1 ? " date to check" : " dates to check");
  }
  function renderBanner() {
    const el = document.getElementById("banner"); el.replaceChildren();
    if (S.dbError) { el.append(h("div", { class: "banner warn", text: S.dbError })); return; }
    if (S.banner) el.append(h("div", { class: "banner " + (S.banner.kind || ""), text: S.banner.text }));
  }
  function renderTabs() {
    const tabs = [["today", "Today", null], ["review", "New", reviewItems().length], ["dates", "Dates", dateItems().length], ["added", "Done", addedItems().length], ["dismissed", "Skipped", dismissedItems().length]];
    const el = document.getElementById("tabs"); el.replaceChildren();
    for (const [key, label, n] of tabs) {
      el.append(h("button", { class: "tab", role: "tab", type: "button", "aria-selected": S.tab === key ? "true" : "false", id: "tab-" + key, onclick: () => { S.tab = key; render(); } }, label, n == null ? null : h("span", { class: "n", text: n })));
    }
  }
  function renderList() {
    const el = document.getElementById("list"); el.replaceChildren();
    if (S.tab === "today") { renderToday(el); return; }
    if (!S.loaded) return;
    if (S.tab === "review") {
      const items = reviewItems();
      if (!items.length) { el.append(emptyState()); return; }
      items.forEach(i => el.append(card(i)));

    db.doc("snapshot/today").onSnapshot(snap => { S.snap = snap.exists ? snap.data() : null; render(); }, () => {});
  });
})();
</script>
