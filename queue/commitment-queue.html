    const sel = S.selected.has(id);
    const dis = !selectable(item) || S.busy;
    const action = str(it.action) || "move";
    const t = safeUrl(item.target_url);
    const eyebrow = h("div", { class: "eyebrow" },
      h("span", { class: "kind" + (str(item.signal) === "done" ? "" : " ask"), text: signalLabel(item) }),
      str(item.company) ? h("span", { text: str(item.company) }) : null,
      str(item.current_due) ? h("span", { text: "· was due " + fmtDay(item.current_due) }) : h("span", { text: "· no date" }),
      str(item.current_due) ? dueBadge(item.current_due) : null,
      str(item.current_progress) ? h("span", { text: "· " + str(item.current_progress) }) : null);
    const titleEl = h("div", { class: "title-static" }, t ? h("a", { href: t, target: "_blank", rel: "noopener", text: str(item.target_title) || "Open task" }) : str(item.target_title));
    const actSel = selectEl("act-" + id, ACTIONS.map(a => a[0]), action, v => { setEdit(id, { action: v }); render(); }, dis);
    [...actSel.options].forEach(o => { const a = ACTIONS.find(x => x[0] === o.value); if (a) o.textContent = a[1]; });
    const fields = h("div", { class: "fields" }, h("label", { class: "field" }, "Action", actSel));
    let chips = null;
    if (action === "move") {
      const inp = h("input", { type: "date", id: "due-" + id, value: str(it.due), disabled: dis });
      inp.addEventListener("change", e => { setEdit(id, { due: e.target.value || null }); render(); });
      fields.append(h("label", { class: "field" }, "New date", inp),
        h("label", { class: "field" }, "Priority", selectEl("prio-" + id, PRIORITIES, str(it.priority) || str(item.current_priority) || "3 - Medium", v => setEdit(id, { priority: v }), dis)));
      if (str(item.current_progress) !== "In progress") {
        const cb = h("input", { type: "checkbox", id: "prog-" + id, checked: it.progress === "In progress", disabled: dis });
        cb.addEventListener("change", e => setEdit(id, { progress: e.target.checked ? "In progress" : null }));
        fields.append(h("label", { class: "field" }, cb, "Mark in progress"));
      }
      const opts = [];
      if (str(item.due)) opts.push(["Suggested", str(item.due)]);
      for (const q of quickDates()) if (!opts.some(o => o[1] === q[1])) opts.push(q);
      chips = h("div", { class: "chips" }, opts.map(([label, d]) => {
        const b = h("button", { class: "chip", type: "button", "aria-pressed": str(it.due) === d ? "true" : "false", disabled: dis, text: label === "Suggested" ? "Suggested · " + fmtDay(d) : fmtDay(d), title: label });
        b.addEventListener("click", () => { setEdit(id, { due: d }); render(); });
        return b;
      }));
    }
    const email = safeUrl(item.email_url);
    const links = email ? h("div", { class: "links" }, h("a", { href: email, target: "_blank", rel: "noopener", text: "Open email" })) : null;
    const box = h("input", { type: "checkbox", id: "sel-" + id, "aria-label": "Select " + (str(item.target_title) || "item"), checked: sel, disabled: dis });
    box.addEventListener("change", e => { if (e.target.checked) S.selected.add(id); else S.selected.delete(id); render(); });
    return h("article", { class: "item" + (sel ? " selected" : "") },
      h("div", { class: "check" }, box),
      h("div", { class: "body" }, eyebrow, titleEl, str(item.reason) ? h("p", { class: "reason", text: str(item.reason) }) : null, fields, chips, links, statusLine(item))
    );
  }
  function selectEl(id, opts, value, onChange, disabled, blankLabel) {
    const s = h("select", { id, disabled });
    for (const o of opts) s.append(h("option", { value: o, text: o || blankLabel || "None", selected: o === value }));
    if (value && !opts.includes(value)) s.append(h("option", { value, text: value, selected: true }));
    s.addEventListener("change", e => onChange(e.target.value));
    return s;
  }
  function statusLine(item) {
    const err = str(item.error);
    const upd = isUpdate(item);
    if (item.status === "adding") return h("div", { class: "status", text: upd ? "Updating Notion…" : "Adding to Notion…" });
    if (item.status === "approved") return h("div", { class: "status good", text: (err ? err + " " : "") + (upd ? "Approved. The agent updates the task on its next run." : "Approved. The agent adds it on its next run.") });
    if (item.status === "check") return h("div", { class: "status warn", text: upd ? (err || "Notion didn't confirm the change.") + " The agent checks the task on its next run and applies it if needed." : (err || "This may already be in Notion.") + " The agent checks Notion on its next run and adds it only if it's missing." });
    return null;
  }
  function addedRow(item) {
    const u = safeUrl(item.notion_url);
    const title = itemTitle(item);
    const what = isUpdate(item) ? updateSummary(item) : "Added";
    return h("div", { class: "row" },
      h("div", { style: "min-width:0" }, h("div", { class: "title-static", text: title }), h("div", { class: "meta", text: [str(item.company), what, item.added_at ? fmtStamp(item.added_at) : "", item.added_by === "agent" ? "by the agent" : ""].filter(Boolean).join(" · ") })),
      u ? h("a", { href: u, target: "_blank", rel: "noopener", text: "Open in Notion" }) : h("span", { class: "meta", text: "In Notion" })
    );
  }
  function itemTitle(item) { return item.type === "note" ? "Note on " + (str(item.target_title) || "a task") : isUpdate(item) ? str(item.target_title) || "A task" : str(item.title); }
  function updateSummary(item) {
    const a = str(item.action) || "move";
    if (a === "done") return "Marked done";
    if (a === "archive") return "Archived";
    return "Moved to " + (fmtDay(item.due) || "a new date") + (item.progress === "In progress" ? ", in progress" : "");
  }
  function dismissedRow(item) {
    const title = itemTitle(item);
    const btn = h("button", { class: "btn", type: "button", id: "restore-" + item.id, text: "Restore", disabled: S.busy });
    btn.addEventListener("click", () => write(item.id, { status: "pending", decided_at: null, error: null }));
    return h("div", { class: "row" },
      h("div", { style: "min-width:0" }, h("div", { class: "title-static", text: title }), h("div", { class: "meta", text: (item.status === "expired" ? "Expired, not reviewed in time" : isUpdate(item) ? (str(item.error) || "Kept as is") : "Dismissed") + (item.decided_at ? " · " + fmtStamp(item.decided_at) : "") })),
      btn
    );
  }
  function renderBar() {
    const bar = document.getElementById("bar");
    const show = S.loaded && (S.tab === "review" || S.tab === "dates") && tabItems().some(selectable);
    bar.hidden = !show;
    if (!show) return;
    const dates = S.tab === "dates";
    const n = tabItems().filter(i => S.selected.has(i.id)).length;
    document.getElementById("count").textContent = S.busy ? "Working…" : n + " selected";
    document.getElementById("add").disabled = !n || S.busy;
    document.getElementById("dismiss").disabled = !n || S.busy;
    document.getElementById("add").textContent = !mcp ? "Approve" : dates ? "Update Notion" : "Add to Notion";
    document.getElementById("dismiss").textContent = dates ? "Keep as is" : "Dismiss";
    const all = tabItems().filter(selectable);
    document.getElementById("selall").textContent = all.length && all.every(i => S.selected.has(i.id)) ? "Clear" : "Select all";
    document.getElementById("selall").disabled = S.busy;
  }
  function setEdit(id, patch) { S.edits.set(id, Object.assign({}, S.edits.get(id) || {}, patch)); }

  // ---------- writes ----------
  async function write(id, patch) {
    if (!db) return;
    try { await db.doc("items/" + id).update(patch); }
    catch (e) { S.banner = { kind: "warn", text: "Couldn't save that change (" + (e && e.code || "error") + "). Try again in a moment." }; render(); throw e; }
  }
  function taskFields(it) { return { title: str(it.title).trim() || str(byId(it.id).title), company: it.company || null, due: it.due || null, priority: it.priority || "3 - Medium", urgency: urgencyFor(it.due) }; }
  function bodyMarkdown(it) {
    const lines = [];
    if (str(it.summary)) lines.push(str(it.summary));
    const email = safeUrl(it.email_url), draft = safeUrl(it.draft_url);
    const subj = str(it.email_subject).replace(/[\[\]]/g, "");
    if (email) lines.push("[" + (subj || "Open email") + "](" + email + ")" + (str(it.email_date) ? " · " + str(it.email_date) : ""));
    if (draft) lines.push("[Draft reply](" + draft + ")");
    return lines.join("\n\n");
  }
  function createInput(it) {
    const p = { "Task Name": it.title, "Progress": "Not started", "Priority": it.priority };
    if (it.urgency) p["Urgency"] = it.urgency;
    if (it.company) p["Company"] = JSON.stringify([it.company]);
    const lead = S.meta && str(S.meta.notion_user_id);
    if (lead) p["Task Lead(s)"] = [lead];
    if (it.due) { p["date:Timeline:start"] = it.due; p["date:Timeline:is_datetime"] = 0; }
    return { parent: { data_source_id: DS_ID }, pages: [{ properties: p, content: bodyMarkdown(it) }] };
  }
  function findNotionUrl(res) {
    let s = ""; try { s = JSON.stringify(res && (res.payload !== undefined ? res.payload : res.content)); } catch (e) { return null; }
    const m = s && s.match(/https:\/\/(?:www\.|app\.)?notion\.(?:so|com)\/[^\s"'\\)\]]+/);
    return m ? m[0] : null;
  }
  function connectorCopy(code) {
    switch (code) {
      case "approval_required": case "consent_required": return "This page needs your OK to use Notion. Allow it when claude.ai asks, then add again.";
      case "needs_reauth": return "Your Notion connection expired. Reconnect Notion in claude.ai Settings, Connectors.";
      case "server_not_connected": case "server_not_found": return "Notion isn't connected for your account. Add it in claude.ai Settings, Connectors.";
      case "selection_required": return "You have more than one Notion connector. Pick one when claude.ai asks.";
      case "not_in_manifest": return "Notion access is turned off for this page. Turn it back on from the page's Permissions menu.";
      case "blocked_by_policy": return "Your organization blocks this Notion action for this page.";
      default: return "Notion isn't available from this page right now.";
    }
  }

  function updateFields(it) {
    const a = str(it.action) || "move";
    return { action: a, due: a === "move" ? (it.due || null) : null, priority: str(it.priority) || str(it.current_priority) || null, progress: a === "move" && it.progress === "In progress" ? "In progress" : null };
  }
  function updateProps(f, base) {
    if (f.action === "done") return { "Progress": "Done" };
    if (f.action === "archive") return { "Progress": "Archived" };
    const p = {};
    const start = str(base.current_start);
    if (start && start <= f.due) { p["date:Timeline:start"] = start; p["date:Timeline:end"] = f.due; }
    else { p["date:Timeline:start"] = f.due; if (start) p["date:Timeline:end"] = null; }
    p["date:Timeline:is_datetime"] = 0;
    p["Urgency"] = urgencyFor(f.due);
    if (f.priority && f.priority !== str(base.current_priority)) p["Priority"] = f.priority;
    if (f.progress && str(base.current_progress) !== "In progress") p["Progress"] = "In progress";
    return p;
  }
  async function updateOne(id, base) {
    const f = updateFields(eff(base));
    if (f.action === "move" && !/^\d{4}-\d{2}-\d{2}$/.test(str(f.due))) { S.banner = { kind: "warn", text: "Pick a new date for " + (str(base.target_title) || "that task") + " first." }; return "stop"; }
    const target = safeUrl(base.target_url);
    if (!target) { await write(id, Object.assign({}, f, { status: "approved", decided_at: nowIso(), error: "No Notion link on this item." })); return "ok"; }
    if (!mcp) { await write(id, Object.assign({}, f, { status: "approved", decided_at: nowIso(), error: null })); S.edits.delete(id); return "ok"; }
    await write(id, Object.assign({}, f, { status: "adding", decided_at: nowIso(), error: null }));
    try {
      await mcp.callTool("Notion", "notion-update-page", { page_id: target, command: "update_properties", properties: updateProps(f, base), allow_async: false });
      await write(id, { status: "added", notion_url: target, added_at: nowIso(), added_by: "page" });
      S.edits.delete(id);
      return "ok";
    } catch (e) {
      const code = e && e.code;
      if (CONNECTOR_CODES.includes(code)) {
        await write(id, { status: "approved", error: null });
        S.banner = { kind: "warn", text: connectorCopy(code) + " What you approved stays approved, and the agent applies it on its next run." };
        return "stop";
      }
      if (code === "tool_error") { await write(id, { status: "approved", error: "Notion refused the change." }); return "ok"; }
      await write(id, { status: "check", error: "Notion didn't confirm the change." });
      return "ok";
    }
  }
  async function addOne(id) {
    const base = byId(id); if (!base || !selectable(base)) return "ok";
    if (isUpdate(base)) return updateOne(id, base);
    const it = Object.assign({}, eff(base), base.type === "note" ? {} : taskFields(eff(base)));
    const fields = base.type === "note" ? {} : taskFields(eff(base));
    if (!mcp) { await write(id, Object.assign({}, fields, { status: "approved", decided_at: nowIso(), error: null })); S.edits.delete(id); return "ok"; }
    await write(id, Object.assign({}, fields, { status: "adding", decided_at: nowIso(), error: null }));
    try {
      let res, url;
      if (base.type === "note") {
        const target = safeUrl(base.target_url);
        const note = str(base.summary) + (safeUrl(base.email_url) ? " [Open email](" + safeUrl(base.email_url) + ")" : "");
        res = await mcp.callTool("Notion", "notion-create-comment", { page_id: target, markdown: note });
        url = target;
      } else {
        res = await mcp.callTool("Notion", "notion-create-pages", createInput(it));
        url = findNotionUrl(res);
      }
      await write(id, { status: "added", notion_url: url || null, added_at: nowIso(), added_by: "page" });
      S.edits.delete(id);
      return "ok";
    } catch (e) {
      const code = e && e.code;
      if (CONNECTOR_CODES.includes(code)) {
        await write(id, { status: "approved", error: null });
        S.banner = { kind: "warn", text: connectorCopy(code) + " What you approved stays approved, and the agent adds it on its next run." };
        return "stop";
      }
      if (code === "tool_error") {
        await write(id, { status: "approved", error: "Notion refused the direct add." });
        return "ok";
      }
      await write(id, { status: "check", error: "Notion didn't confirm the add." });
      return "ok";
    }
  }
  async function addSelected() {
    const ids = tabItems().filter(i => S.selected.has(i.id) && selectable(i)).map(i => i.id);
    if (!ids.length) return;
    S.busy = true; S.banner = null; render();
    let added = 0;
    for (const id of ids) {
      let r; try { r = await addOne(id); } catch (e) { r = "stop"; }
      S.selected.delete(id);
      if (r === "ok") added++;
      if (r === "stop") break;
    }
    S.busy = false;
    if (!S.banner && added) S.banner = { kind: "", text: mcp ? "Done. Check the Done tab for Notion links." : "Approved. The agent finishes them on its next run." };
    render();
  }
  async function dismissSelected() {
    const ids = tabItems().filter(i => S.selected.has(i.id) && selectable(i)).map(i => i.id);
    if (!ids.length) return;
    S.busy = true; render();
    for (const id of ids) { try { await write(id, { status: "dismissed", decided_at: nowIso(), error: null }); S.selected.delete(id); } catch (e) { break; } }
    S.busy = false; render();
  }

  document.getElementById("add").addEventListener("click", addSelected);
  document.getElementById("dismiss").addEventListener("click", dismissSelected);
  document.getElementById("selall").addEventListener("click", () => {
    const all = tabItems().filter(selectable);
    if (all.every(i => S.selected.has(i.id))) S.selected.clear(); else all.forEach(i => S.selected.add(i.id));
    render();
  });

  // ---------- boot ----------
  render();
  const slowTimer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { S.dbError = "Open this page on claude.ai to see your queue."; S.loaded = true; clearTimeout(slowTimer); render(); return; }
  cl.use("mcp").then(m => { mcp = m; render(); }).catch(() => { mcp = null; });
  cl.use("db").then(d => {
    db = d;
    if (!db) { S.dbError = "The queue isn't available in this view. Open it on claude.ai while signed in."; S.loaded = true; clearTimeout(slowTimer); render(); return; }
    db.collection("items").onSnapshot(snap => {
      S.items = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
      for (const id of [...S.selected]) { const i = byId(id); if (!i || !selectable(i)) S.selected.delete(id); }
      if (!snap.metadata.fromCache) { S.loaded = true; S.slow = false; clearTimeout(slowTimer); }
      else if (snap.size) { S.loaded = true; }
      render();
    }, err => { S.dbError = "The queue stopped updating (" + (err && err.code || "error") + "). Reload the page."; S.loaded = true; clearTimeout(slowTimer); render(); });
    db.doc("meta/agent").onSnapshot(snap => { S.meta = snap.exists ? snap.data() : null; render(); }, () => {});
  });
})();
</script>
